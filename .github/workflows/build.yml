name: Build AmiTablet FAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install uFBT
        run: python -m pip install --upgrade ufbt

      - name: Initialize Flipper SDK
        run: ufbt update --index-url=https://update.flipperzero.one/firmware/directory.json --channel=release

      - name: Read AmiTablet version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("application.fam").read_text(encoding="utf-8")
          match = re.search(r"fap_version=\((\d+)\s*,\s*(\d+)\)", text)
          if not match:
              raise SystemExit("Unable to read fap_version from application.fam")
          print(f"{match.group(1)}.{match.group(2)}")
          PY
          )
          echo "AMITABLET_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build AmiTablet
        run: ufbt

      - name: Version FAP filename
        shell: bash
        run: |
          FAP=$(find dist -maxdepth 1 -type f -name '*.fap' | head -n 1)
          if [ -z "$FAP" ]; then
            echo "No FAP found in dist/"
            exit 1
          fi
          mv "$FAP" "dist/AmiTablet-v${AMITABLET_VERSION}.fap"

      - name: Upload FAP
        uses: actions/upload-artifact@v4
        with:
          name: AmiTablet-v${{ env.AMITABLET_VERSION }}-fap
          path: dist/*.fap
          if-no-files-found: error
